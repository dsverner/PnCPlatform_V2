<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setting Display · P&amp;C Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#1f3a4d">
</head>
<body>
  <!-- W6 (decision #127; LEGACY-SYSTEM §8 setting display, §2 fields): one designed configuration-file revision shown in the
       legacy's five groups — General · System Info · M/P Information · Aux CT/PT Info · Documentation — over
       document.vSettingsRecord, document.vParsedSettingNamed, document.vFile and the run's records. A legacy field with no
       platform counterpart is shown as "not modelled" so the walkthrough can point at it. No inline script or style. -->
  <header class="bar">
    <span class="brand"><a href="/">P&amp;C Platform</a> <span class="crumb">/ <a href="/settings.html">Settings</a> / Display</span></span>
    <span id="who" class="who">signing in…</span>
  </header>
  <main class="one">
    <section class="panel wide">
      <div class="toolbar"><h2 id="title">Setting display</h2><div class="actions"><span id="state-pill" class="pill" hidden></span><a id="req-link" class="row-link" hidden>Change request</a></div></div>
      <p id="status" class="status muted">…</p>
      <div class="groups">
        <div class="group"><h3>General</h3><dl id="g-general" class="facts"></dl></div>
        <div class="group"><h3>System info</h3><dl id="g-system" class="facts"></dl></div>
        <div class="group"><h3>M/P information</h3><dl id="g-mp" class="facts"></dl></div>
        <div class="group"><h3>Aux CT/PT info</h3><dl id="g-aux" class="facts"></dl></div>
        <div class="group"><h3>Documentation</h3><dl id="g-doc" class="facts"></dl></div>
      </div>
    </section>
    <section class="panel wide">
      <h2>Settings (SET1)</h2>
      <p id="settings-summary" class="muted small">…</p>
      <div class="scroll"><table id="settings" class="grid rows"><thead></thead><tbody></tbody></table></div>
    </section>
    <section class="panel wide">
      <h2>Files and evidence</h2>
      <p id="files-summary" class="muted small">…</p>
      <div class="scroll"><table id="files" class="grid rows"><thead></thead><tbody></tbody></table></div>
    </section>
  </main>
  <script src="/pnc.js"></script>
  <script src="/setting.js"></script>
</body>
</html>
