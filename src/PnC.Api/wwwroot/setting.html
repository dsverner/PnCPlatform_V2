<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Settings Record · P&amp;C Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#1f3a4d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1d27" media="(prefers-color-scheme: dark)">
</head>
<body>
  <!-- W8 (decisions #157–#158; round 4 C, round 5 B4): one designed configuration-file revision — the record's facts, the
       parsed settings, the settings text as filed, the notes, the files — with Close and Documentation at the top as the
       legacy window had, and Compare with another revision of the same device. No legacy field names on screen (owner,
       2026-09-14). Over document.vSettingsRecord, vParsedSettingNamed, vFile, the run's records. No inline script or style. -->
  <header class="bar">
    <span class="brand"><a href="/">P&amp;C Platform</a> <span class="crumb">/ <a href="/settings.html">Settings</a> / Record</span></span>
    <span id="who" class="who">signing in…</span>
  </header>
  <main class="one">
    <section class="panel wide">
      <div class="toolbar">
        <h2 id="title">Settings record</h2>
        <div class="actions">
          <span id="state-pill" class="pill" hidden></span>
          <button id="btn-close" type="button" title="Back to the settings book">Close</button>
          <button id="btn-docs" type="button" title="The files filed with this record">Documentation</button>
          <button id="btn-compare" type="button" title="Put another revision of this device beside this one">Compare…</button>
          <a id="req-link" class="row-link" hidden>Change request</a>
        </div>
      </div>
      <p id="status" class="status muted">…</p>
      <div class="groups">
        <div class="group"><h3>Device</h3><dl id="g-device" class="facts"></dl></div>
        <div class="group"><h3>Where</h3><dl id="g-where" class="facts"></dl></div>
        <div class="group"><h3>Dates and state</h3><dl id="g-dates" class="facts"></dl></div>
        <div class="group"><h3>Classification and instrument transformers</h3><dl id="g-mp" class="facts"></dl></div>
        <div class="group"><h3>Notes</h3><dl id="g-notes" class="facts"></dl></div>
      </div>
    </section>
    <section id="compare" class="panel wide" hidden>
      <div class="toolbar"><h2>Compare</h2><div class="actions"><label class="inline">With <select id="compare-with"></select></label><button id="btn-compare-close" type="button">Hide</button></div></div>
      <p id="compare-summary" class="muted small">…</p>
      <div class="scroll"><table id="compare-table" class="grid rows"><thead></thead><tbody></tbody></table></div>
    </section>
    <section class="panel wide">
      <h2>Settings</h2>
      <p id="settings-summary" class="muted small">…</p>
      <div class="scroll"><table id="settings" class="grid rows"><thead></thead><tbody></tbody></table></div>
      <h3 id="text-head">Settings text as filed</h3>
      <pre id="settings-text" class="settings-text">…</pre>
    </section>
    <section id="files-panel" class="panel wide">
      <h2>Documentation — files and evidence</h2>
      <p id="files-summary" class="muted small">…</p>
      <div class="scroll"><table id="files" class="grid rows"><thead></thead><tbody></tbody></table></div>
    </section>
  </main>
  <script src="/pnc.js"></script>
  <script src="/setting.js"></script>
</body>
</html>
