<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Requests · P&amp;C Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#1f3a4d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1d27" media="(prefers-color-scheme: dark)">
</head>
<body>
  <!-- W8 (decision #158; round 5 B5, after Dev_Final's Pending Approvals): the queue of change requests over
       work.vChangeRequestStatus — counters, a state and location filter, a row opens the request. Counts are made in the
       browser from the rows read; nothing is stored. No inline script or style. -->
  <header class="bar">
    <span class="brand"><a href="/">P&amp;C Platform</a> <span class="crumb">/ Requests</span>
      <nav class="nav"><a href="/settings.html">Settings</a> <a href="/floc.html">Locations</a> <a href="/schemes.html">Schemes</a> <a href="/grants.html">Grants</a> <a href="/definitions.html">Definitions</a></nav></span>
    <span id="who" class="who">signing in…</span>
  </header>
  <main class="one">
    <section class="panel wide">
      <div class="counters" id="counters"></div>
    </section>
    <section class="panel wide">
      <div class="toolbar">
        <h2>Change requests</h2>
        <div class="actions">
          <label class="inline">State <select id="state"><option value="open">Open (raised or in progress)</option><option value="Raised">Raised</option><option value="InProgress">In progress</option><option value="Closed">Closed</option><option value="Cancelled">Cancelled</option><option value="">Every state</option></select></label>
          <label class="inline">Location <select id="station"><option value="">(any)</option></select></label>
          <label class="inline">Find <input id="filter" type="search" placeholder="title, device, requester…" autocomplete="off"></label>
          <button id="btn-csv" type="button">Export CSV</button>
          <button id="btn-refresh" type="button">Refresh</button>
        </div>
      </div>
      <p id="status" class="status muted">…</p>
      <div class="scroll"><table id="grid" class="grid rows"><thead></thead><tbody></tbody></table></div>
      <p id="summary" class="muted small">—</p>
    </section>
  </main>
  <script src="/pnc.js"></script>
  <script src="/requests.js"></script>
</body>
</html>
