<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locations · P&amp;C Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#1f3a4d">
</head>
<body>
  <!-- W6 (decision #57, #127; FR-7.2; PROCEDURE-ENGINE §10 row 10): the Location / Protected Asset / Protection Function view
       as a projection of the FLOC tree — the tree on the left (location.vNodeTree, lazily), the positions with their device
       and functions on the right (location.vFloc), and browse by station, panel, scheme (location.vFlocScheme) and model.
       No inline script or style. -->
  <header class="bar">
    <span class="brand"><a href="/">P&amp;C Platform</a> <span class="crumb">/ Locations</span>
      <nav class="nav"><a href="/app/s/SETTINGS_BOOK">Settings</a> <a href="/app/s/REQUEST_QUEUE">Requests</a> <a href="/schemes.html">Schemes</a> <a href="/grants.html">Grants</a> <a href="/definitions.html">Definitions</a></nav></span>
    <span id="who" class="who">signing in…</span>
  </header>
  <main class="defs">
    <aside class="panel">
      <h2>Functional locations</h2>
      <p class="muted small" id="tree-summary">…</p>
      <ul id="tree" class="tree"></ul>
    </aside>
    <section class="panel">
      <div class="toolbar">
        <div class="doc-title" id="browse-title">Every position</div>
        <div class="actions">
          <label class="inline">Scheme <select id="scheme"><option value="">(any)</option></select></label>
          <label class="inline">Model <select id="model"><option value="">(any)</option></select></label>
          <label class="inline">Filter <input id="filter" type="search" placeholder="station, panel, device…" autocomplete="off"></label>
          <button id="btn-clear" type="button">Clear</button>
        </div>
      </div>
      <p id="status" class="status muted">…</p>
      <div class="scroll"><table id="grid" class="grid rows"><thead></thead><tbody></tbody></table></div>
      <p id="summary" class="muted small">—</p>
    </section>
    <section id="action" class="panel wide" hidden>
      <h2 id="action-title">New setting</h2>
      <div id="action-body"></div>
      <p id="action-status" class="status muted"></p>
    </section>
  </main>
  <script src="/pnc.js"></script>
  <script src="/floc.js"></script>
</body>
</html>
