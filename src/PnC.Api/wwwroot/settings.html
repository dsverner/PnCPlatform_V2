<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · P&amp;C Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#1f3a4d">
</head>
<body>
  <!-- W6 (decisions #127–#129; LEGACY-SYSTEM §8 main window; PROCEDURE-ENGINE §10 rows 1–3, 7–9): the settings grid over
       document.vSettingsRecord — the state toggle, the column chooser, the print, Set Verified Date and Request Change.
       No inline script or style — the CSP forbids both. -->
  <header class="bar">
    <span class="brand"><a href="/">P&amp;C Platform</a> <span class="crumb">/ Settings</span>
      <nav class="nav"><a href="/floc.html">Locations</a> <a href="/grants.html">Grants</a> <a href="/definitions.html">Definitions</a></nav></span>
    <span id="who" class="who">signing in…</span>
  </header>
  <main class="one">
    <section class="panel wide">
      <div class="toolbar">
        <div class="states" role="group" aria-label="Grid state">
          <button type="button" class="state" data-state="Active">Active</button>
          <button type="button" class="state" data-state="Outstanding">Outstanding</button>
          <button type="button" class="state" data-state="Archived">Archived</button>
        </div>
        <div class="actions">
          <label class="inline">Location <select id="station"><option value="">(all stations)</option></select></label>
          <label class="inline">Filter <input id="filter" type="search" placeholder="station, device, model…" autocomplete="off"></label>
          <button id="btn-columns" type="button">Select columns</button>
          <button id="btn-print" type="button">Print</button>
          <button id="btn-refresh" type="button">Refresh</button>
        </div>
      </div>
      <p id="status" class="status muted">…</p>
      <div id="columns" class="chooser" hidden></div>
      <div class="print-head" id="print-head" aria-hidden="true"></div>
      <div class="scroll"><table id="grid" class="grid rows"><thead></thead><tbody></tbody></table></div>
      <p id="summary" class="muted small">—</p>
    </section>
    <section id="action" class="panel wide" hidden>
      <h2 id="action-title">Action</h2>
      <div id="action-body"></div>
      <p id="action-status" class="status muted"></p>
    </section>
  </main>
  <script src="/pnc.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
