<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Settings · P&amp;C Platform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#1f3a4d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1d27" media="(prefers-color-scheme: dark)">
</head>
<body>
  <!-- W8 (decisions #157–#158; the owner's round-4 and round-5 rulings): the settings book in the legacy shape — a location
       first, then its functional schemes as collapsed groups, rows only under an opened group, a row that unfolds to its
       card with the settings text; the state toggle, the column chooser, filters by field, the right-click commands, Export
       CSV and the location report. Over document.vSettingsRecord. No inline script or style — the CSP forbids both. -->
  <header class="bar">
    <span class="brand"><a href="/">P&amp;C Platform</a> <span class="crumb">/ Settings</span>
      <nav class="nav"><a href="/requests.html">Requests</a> <a href="/floc.html">Locations</a> <a href="/schemes.html">Schemes</a> <a href="/grants.html">Grants</a> <a href="/definitions.html">Definitions</a></nav></span>
    <span id="who" class="who">signing in…</span>
  </header>
  <main class="defs">
    <aside class="panel">
      <h2>Locations</h2>
      <input id="station-filter" type="search" placeholder="type to find a location" autocomplete="off" class="wide-input" aria-label="Find a location">
      <p class="muted small" id="station-summary">…</p>
      <ul id="stations" class="stations"></ul>
    </aside>
    <section class="panel">
      <div class="toolbar">
        <div class="states" role="group" aria-label="Grid state">
          <button type="button" class="state" data-state="Active">Active</button>
          <button type="button" class="state" data-state="Outstanding">Outstanding</button>
          <button type="button" class="state" data-state="Archived">Archived</button>
        </div>
        <div class="actions">
          <label class="inline">Group by <select id="grouping"><option value="scheme">Scheme</option><option value="panel">Equipment</option><option value="none">Nothing</option></select></label>
          <label class="inline">Find <input id="filter" type="search" placeholder="device, model, function…" autocomplete="off"></label>
          <button id="btn-filter" type="button">Add filter</button>
          <button id="btn-columns" type="button">Select columns</button>
          <button id="btn-csv" type="button">Export CSV</button>
          <button id="btn-print" type="button">Print report</button>
          <button id="btn-refresh" type="button">Refresh</button>
        </div>
      </div>
      <div id="filters" class="chips" hidden></div>
      <p id="status" class="status muted">…</p>
      <div id="columns" class="chooser" hidden></div>
      <div class="scroll"><table id="grid" class="grid rows grouped"><thead></thead><tbody></tbody></table></div>
      <p id="summary" class="muted small">—</p>
    </section>
    <section id="action" class="panel wide" hidden>
      <h2 id="action-title">Action</h2>
      <div id="action-body"></div>
      <p id="action-status" class="status muted"></p>
    </section>
  </main>
  <script src="/pnc.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
